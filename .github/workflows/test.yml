# I test automatici della consegna. GitHub li lancia a ogni push: verde se passano tutti.
# Il lavoro si chiama «test»: è quello che il mercato del corso guarda alla scadenza.
name: test
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04   # fissata: da ottobre 2026 «ubuntu-latest» passa a Ubuntu 26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Test ufficiali della consegna
        run: |
          # I test ufficiali stanno nel repository pubblico del corso, nella cartella con il prefisso
          # di questo repository (punteggio-…, lab1-…): vengono copiati sopra quelli del repository.
          NOME="${GITHUB_REPOSITORY#*/}"
          PREFISSO="${NOME%%-*}"
          if git clone --depth 1 https://github.com/poo-uniud-2627/test-ufficiali.git /tmp/test-ufficiali \
             && [ -d "/tmp/test-ufficiali/$PREFISSO" ]; then
            mkdir -p test
            cp -r "/tmp/test-ufficiali/$PREFISSO/." test/
            echo "Test ufficiali copiati da test-ufficiali/$PREFISSO"
          else
            echo "Test ufficiali non trovati: si usano quelli del repository"
          fi
      - name: Compila
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out -cp lib/junit-platform-console-standalone-1.10.2.jar $(find src test -name "*.java")
      - name: Esegui i test
        run: java -jar lib/junit-platform-console-standalone-1.10.2.jar execute --class-path out --scan-class-path --fail-if-no-tests --disable-banner --details=tree
